[project]
name = "ci-cd-secure-api"
version = "0.1.0"
description = "A small Python API with CI/CD, Docker, automated tests, and security checks."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Your Name" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7.0",
    "httpx>=0.27.0",
    "mypy>=1.13.0",
    "pip-audit>=2.7.0",
    "pre-commit>=4.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0"
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/secure_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-q",
    "--cov=secure_api",
    "--cov-report=term-missing",
    "--cov-report=xml"
]

[tool.coverage.run]
branch = true
source = ["secure_api"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "PL"
]
ignore = [
    "PLR2004"
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["secure_api"]
warn_unused_configs = true
warn_return_any = true
warn_unreachable = true
pretty = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = []

[tool.pip-audit]
desc = true